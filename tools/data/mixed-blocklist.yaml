# ============================================================
# mixed 词库更新 · 删除候选表
# ============================================================
# 用途：以后把 mixed.dict.yaml（或同类词库）的新词合并进自己的词库前，
#       先按本表剔除下列候选词条。
# 说明：
#   只列词头，不列注音；注音以被合并的词库为准。
#   候选大类用注释标注，便于整类取舍。
#   本表来自 cn&en.dict.yaml 与 mixed.dict.yaml 的差异分析，
#     完整依据见同目录 E-删除清单.md。
#   保留未列入的词：电商/会员类、AI 应用类（AI短剧/AI垃圾/即梦AI/AI大模型）、
#     网络流行语、数码配件与系统参数、通信制式（4A/5G/6G）、R角、Be动词。
# ============================================================

# ============================================================
# 通用排除模式（以后的词库更新同样适用，命中即剔除）
# ============================================================
#   军事装备       歼 / 轰 / 运/ 直/ 武直 / 空警 / 东风 / 红旗 / 红箭 / 鹰击 /
#                  霹雳 / 巨浪 / 长剑 / 惊雷 / Type-数字 / MBT / 彩虹 / 翼龙 / 无侦 等
#   汽车品牌与车型 奥迪 / 宝马 / 奔驰 / 蔚来 / 理想 / 小鹏 / 腾势 / 问界 / 智界 /
#                  享界 / 尊界 / 仰望 / 智己 / 特斯拉 / 沃尔沃 / 凯迪拉克 /
#                  雷克萨斯 / 保时捷 / 捷豹 / 大众 / 别克 / 比亚迪 等
#   AI 模型名       GPT / Claude / Gemini / Grok / DeepSeek / Kimi / Qwen / GLM /
#                  MiniMax / Mistral / Baichuan / LongCat / 混元 / SenseNova /
#                  Seedance / Seedream / SkyReels / Muse / MAI 等版本变体
#   苹果等产品      iPhone / iPad / iPod / Mac / MacBook / Apple / AirPods / Magic 系列
#   报错说法        报XXX、会报XXX（HTTP 状态码口语）
#   动漫与人物      D 之一族、海贼王人物、多边兽Z 等
#   钓鱼 / 渔具     路亚竿调性（UL/MH/ML/XH/XXH 等 + 调）、8字环、FG结、PR结、
#                  PE线、VIB、T尾 等
#   字母数字类      车型代号（i3~i9、L6~L9）；通信制式（4A/5G/6G）与 R角 除外，保留
# ============================================================


