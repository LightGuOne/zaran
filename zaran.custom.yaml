patch:
  # show_notifications: false
  # style/+: 
  #   preedit_type: preview
  #   inline_preedit: true
  #   layout:
  #     margin_x: -10

  schema/dependencies/+:
    - wanxiang_reverse               # 反查
    - chaifen
    # - kagiroi


  engine/processors/@before 2: lua_processor@*kagiroi/kagiroi_kana_speller  # 需要在key_binder后面
  # engine/segmentors/@before 2: lua_segmentor@*mylua.paired_punct            # 成对符号
  engine/segmentors/@before 3: affix_segmentor@kagiroi                      # 需要在abc_segmentor前面
  engine/segmentors/@before 4: affix_segmentor@reverse_wanxiang
  engine/translators/+:
    - reverse_lookup_translator@reverse_wanxiang   # 反查
    - lua_translator@*mylua.mixed_V                # 混合V
    - lua_translator@*unicode                      # Unicode
    - lua_translator@*kagiroi/kagiroi_translator
  engine/filters/@before 1: lua_filter@*kagiroi/kagiroi_aux_filter@reverse  # kagiroi辅筛


  key_binder/bindings/+:
    - { when: has_menu, accept: Control+Shift+G, toggle: inflexible }               # 魔然固词开关
    - { when: composing, accept: "Control+g", toggle: extended_charset }            # 大小字符集
    - { when: has_menu, accept: "Control+s", toggle: tone_display }                 # 拼音显示
    - { when: has_menu, accept: "Control+b", toggle: chaifen_switch }               # 补全信息开关
    # - { when: has_menu, accept: "Control+0", toggle: std_opencc }             # 切换用字标准 
    # - { when: has_menu, accept: "Control+Shift+parenright", toggle: std_opencc }    # 切换用字标准 
    # - { match: "^[a-z]{2,3}", accept: "Shift+Shift_L", send_sequence: 3 }           # 有候选时三选
    # - { match: "^V.+", accept: "KP_Enter", send_sequence: '{space}' }           # 空格上屏
    # - { when: composing, accept: "space", send_sequence: '{Return}l/' } 
    # - { when: has_menu, accept: "Control+b", toggle: fuzhu_hint }                 # 拼音显示
    # - { when: has_menu, accept: "Control+Shift+B", toggle: chaifen_switch }               # 补全信息开关


  recognizer/patterns/+:
    reverse_wanxiang: "^olf[A-Za-z]*$"  # 反查入口
    mixed_V: "^V.*$"                    # 混合V
    unicode: "^U[a-f0-9]+"              # Unicode
    kagiroi: '^(?:ok|\xE3\x81[\x81-\xBF]|\xE3\x82[\x80-\x9F]|\xE3\x83\xBC)(?:\xE3\x81[\x81-\xBF]|\xE3\x82[\x80-\x9F]|\xE3\x83\xBC|[a-z\-;`])*$'


  reverse_wanxiang:
    tag: reverse_wanxiang
    dictionary: wanxiang_reverse
    db_class: stabledb
    enable_completion: true  # 启用候选词补全
    prefix: "olf"  # 反查前缀（反查时前缀会消失影响打英文所以设定为两个字母，或可改成一个非字母符号）
    enable_user_dict: false  # 禁用用户词典，是否开启自动调频
    tips: 〔反查〕
    preedit_format:
      - xform/^o(lf|bh|cj|vy|hm)//


  kagiroi:
    prefix: ok
    tips: 〔カギロイ〕
    tag: kagiroi
    layout: romaji
    speller:
      __include: kagiroi:/alphabet/3_dan
    translator:
      input_mapping:
        - xform/^([^`]*)n$/$1ん$/
    gikun:    # 训读
      enable: true
      delimiter: ";"


  simple_comment:
    candidate_length: 1               # 候选词辅助码提醒的生效长度，0为关闭  但同时清空其它，应当使用上面开关来处理
    corrector_type: "comment"         # 换一种显示类型，比如"({comment})" 


  paired_punct:
    pattern: '^([aswdf])`'
    defer:
      - "，"
      - "、"
      - "|"
    dict:
      a: ['《','》']
      w: ['（','）']
      s: ['「','」']
      d: ['『','』']
      f: ['"','"']

  moran/quick_code_indicator: "<"
