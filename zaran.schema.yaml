# Rime schema
# encoding: utf-8

# 方案说明
schema:
  schema_id: zaran
  name: 雜然
  version: "20251026"
  # icon: ico/chn.ico
  author:
    - AMZ
    - ksqsf
    - kuroame
    - light
  description: |
    賦流形
  dependencies:
    - wanxiang_mixedcode      # 中英混输
    - zaran_english           # 英文输入
    - moran_fixed             # 魔然字词
    - moran_charset           # 魔然过滤器


# 开关
# reset: 默认状态。注释掉后，切换窗口时不会重置到默认状态。
# states: 方案选单显示的名称。可以注释掉，仍可以通过快捷键切换。
# abbrev: 默认的缩写取 states 的第一个字符，abbrev 可自定义一个字符
switches:
  - name: ascii_punct     # 中英标点
    states: [ ¥, $ ]
  - name: full_shape
    states: [ 半角🌗, 全角🌕 ]          # 2024-09-05
  - name: chaifen_switch                # 2025-03-30
    states: [拆字❌, 拆字✔] 
  - name: traditionalization
    states: [ 简体, 繁體 ]               # 2024-09-05
  - name: extended_charset
    states: [ 通用, 增廣 ]
  - name: inflexible
    states: [ 動詞, 固詞 ] # 「固詞」表示「固頂詞」
  - options: [ std_opencc,  std_tw, std_hk]
    reset: 0
    states: [ 通, 臺, 港]



# 输入引擎
engine:
  processors:
    - key_binder                          # 快捷键
    - lua_processor@*moran.moran_pin*pin_processor                            # PIN
    - lua_processor@*moran.moran_processor                                    # 魔然processor
    - ascii_composer                      # 按键是否启动(Ctrl键、CapsLock键、Shift键等)
    - recognizer                          # 处理符合特定规则的输入码，如网址、反查
    - lua_processor@*key_binder           # 绑定按键扩展能力
    - speller                             # 拼写设定
    - punctuator                          # 标点符号
    - selector                            # 选字处理器，处理数字选字键〔可以换成别的哦〕、上、下候选定位、换页
    - navigator                           # 处理输入栏内的光标移动
    - express_editor                      # 编辑器，处理空格、回车上屏、回退键
  segmentors:
    - ascii_segmentor                     # 标识英文段落〔譬如在英文模式下〕字母直接上屛
    - matcher                             # 配合 recognizer 标识符合特定规则的段落，如网址、反查等，加上特定 tag
    - matcher@recognizer_secondary        # 英文正则
    - abc_segmentor                       # 标识常规的文字段落，加上 abc 这个 tag
    - punct_segmentor                     # 标识符号段落〔键入标点符号用〕加上 punct 这个 tag
    - fallback_segmentor                  # 标识其他未标识段落，必须放在最后帮助tag模式切换后回退重新处理
  translators:
    - punct_translator                    # 配合 punct_segmentor 转换标点符号
    - table_translator@wanxiang_mixedcode # 中英等混合词汇表导入
    - table_translator@zaran_english       # 英文词典
    - lua_translator@*mylua.pseudo_moran@with_reorder                         # 伪·魔然翻譯器
    - table_translator@custom_phrase      # 自定义短语
    - lua_translator@*moran.moran_pin*panacea_translator                      # PIN
  filters:
    - lua_filter@*moran.moran_charset_filter                                  # 魔然字符集过滤
    - lua_filter@*moran.moran_pin*pin_filter                                  # PIN
    - lua_filter@*moran.moran_reorder_filter                                  # 魔然滤镜
    - lua_filter@*moran.moran_ijrq_filter                                     # 魔然出简让全
    - lua_filter@*mylua.simple_comment    #  简易注释
    - lua_filter@*moran.moran_hint_filter                                     # 魔然简词提示
    - lua_filter@*mylua.add_words         # 英文造词
    - simplifier@traditionalize           # 简繁切换
    - simplifier@std_hk                   # 香港用字标准
    - simplifier@std_tw                   # 台湾用字标准
    - uniquifier                          # 去重


# 固词翻译器
translator:
  dictionary: zaran         # 挂载词库
  prism: zaran              # 多方案共用一个词库时，为避免冲突，需要用 prism 指定一个名字。
  initial_quality: 5        # 初始权重
  spelling_hints: 20        # 将注释以词典字符串形式完全暴露
  contextual_suggestions: false  # 语言模型预测词组权重
  core_word_length: 4       # >0 启用，按段学词 + 相邻段拼接
  max_word_length: 7        # >0 启用，过长短语不记整词，只加元素权重
  enable_completion: true   # 补全提示
  enable_user_dict: false   # 用户词典
  max_homographs: 5         # 最大同形簇长度
  max_homophones: 7         # 最大同音簇长度



# 动词翻译器
frequency:
  dictionary: zaran         # 挂载词库
  prism: zaran              # 多方案共用一个词库时，为避免冲突，需要用 prism 指定一个名字。
  initial_quality: 5        # 初始权重
  spelling_hints: 20        # 将注释以词典字符串形式完全暴露
  contextual_suggestions: false  # 语言模型预测词组权重
  core_word_length: 4       # >0 启用，按段学词 + 相邻段拼接
  max_word_length: 7        # >0 启用，过长短语不记整词，只加元素权重
  enable_completion: true   # 补全提示
  max_homographs: 5         # 最大同形簇长度
  max_homophones: 10        # 最大同音簇长度
  max_sentences: 2


# 字词翻译器
fixed:                      # 固頂輸入模式設置，在 top_translator 中被調用
  dictionary: moran_fixed_simp
  initial_quality: 1000     # 初始权重
  enable_completion: false  # 启用候选词补全
  enable_sentence: false    # 禁止造句
  enable_user_dict: false   # 禁用用户词典
  enable_encoder: false     # 是否开启自动造词
  encode_commit_history: true # 是否对已上屛词自动成词


# 次翻译器 英文
zaran_english:
  dictionary: zaran_english # 挂载词库
  tag: english              # librime<=1.11 請在 custom 中置空
  initial_quality: 1.2      # 初始权重
  enable_sentence: false    # 禁止造句
  user_dict: zaran_english
  comment_format:           # 自定义提示码
    - xform/.*//            # 清空提示码


# 中英混输
wanxiang_mixedcode:
  dictionary: wanxiang_mixedcode     # 挂载词库
  tag: english              # librime<=1.11 請在 custom 中置空
  initial_quality: 1.1      # 初始权重
  enable_sentence: false    # 禁止造句
  enable_user_dict: false   # 禁用用户词典
  comment_format:           # 自定义提示码
    - xform/.*//            # 清空提示码


# 自定义短语
custom_phrase:
  dictionary: ""            # 挂载词库 
  initial_quality: 99       # 初始权重
  user_dict: mydict         
  db_class: stabledb        # 只读数据库，无法动态调频；设为 tabledb 可以动态调频
  enable_completion: false  # 补全提示
  enable_sentence: false    # 禁止造句


# 简繁切换
traditionalize:
  option_name: traditionalization
  opencc_config: s2t.json   # s2t.json | s2hk.json | s2tw.json | s2twp.json
  tips: char                # 转换提示: all 都显示 | char 仅单字显示 | none 不显示。
  tags: [ abc, number, gregorian_to_lunar, mixed_V ]  # 限制在对应 tag，不对其他如反查的内容做简繁转换

std_hk:
  opencc_config: t2hk.json
  # opencc_config: s2hk.json
  option_name: std_hk
  tips: all
  tags: [abc]

std_tw:
  opencc_config: t2tw.json
  # opencc_config: s2tw.json
  option_name: std_tw
  tips: all
  tags: [abc]
  
# 标点符号
punctuator:
  digit_separator_action: "commit"
  __include: default:/punctuator


# 处理符合特定规则的输入码，如网址、反查
recognizer:
  import_preset: default    # 从 default.yaml 继承通用的
  patterns:  # 再增加方案专有的：


recognizer_secondary:
  patterns:
    # 1. 輸入長度達到 4 後開始輸出英語 *或* 前 4 字母中有大寫字母
    english: '(^[A-Za-z]{4}[A-Za-z]*)|(^[A-Z][A-Za-z]*)|(^[a-z][A-Z][a-zA-Z]*)|(^[a-z][a-z][A-Z][a-zA-Z]*)'
    # 2. 對任何輸入都輸出英語
    # english: '.*'
    # 3. 輸入長度達到 4 後開始輸出英語
    # english: '^[A-Za-z]{4}[A-Za-z]*'


# 从 default 继承快捷键
key_binder:
  import_preset: default    # 从 default.yaml 继承通用的
  bindings: 

editor:
  bindings:
    space: confirm                        # 空格键：上屏候选项
    Return: commit_raw_input              # 回车键：上屏原始输入
    Control+Return: commit_script_text    # Ctrl+回车键：上屏变换后输入（经过 preedit转换的）
    Control+Shift+Return: commit_comment  # Ctrl+Shift+回车键：上屏 comment
    BackSpace: revert                     # 退格键：向前删除（撤消上次输入）
    Delete: delete                        # Delete 键：向后删除
    Control+BackSpace: back_syllable      # Ctrl+退格键：删除一个音节
    Control+Delete: delete_candidate      # Ctrl+Delete键：删除或降权候选项
    Escape: cancel                        # Esc 键：取消输入

# 在边界按音节移动，在音节内部按字符移动  rewind , forward
# 按字符移动（循环）       left_by_char , right_by_char
# 按字符移动（不循环）     left_by_char_no_loop , right_by_char_no_loop
# 按音节跳转（循环）       left_by_syllable , right_by_syllable
# 按音节跳转（不循环）     left_by_syllable_no_loop , right_by_syllable_no_loop
navigator:
  # 在音節跳轉時，跳過音節末尾的分隔符 ' ，設爲 after_delimiter 恢復 Rime 默認行爲
  syllable_jump_position: before_delimiter
  bindings:
    Left: left_by_syllable
    Right: right_by_char
    # Shift+Left: left_by_syllable
    # Shift+Right: right_by_syllable


# 拼写设定
speller:
  # 如果不想让什么标点直接上屏，可以加在 alphabet，或者编辑标点符号为两个及以上的映射
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`/
  # initials 定义仅作为始码的按键，排除 ` 让单个的 ` 可以直接上屏
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"  # 第一位<空格>是拼音之间的分隔符；第二位<'>表示可以手动输入单引号来分割拼音。
  auto_select: true
  auto_select_pattern: ^(\w+)/
  algebra:
    __include: zaran_algebra:/pro/自然码


grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 7
  # collocation_max_length: 6
  collocation_min_length: 3
  collocation_penalty: -10
  non_collocation_penalty: -20
  weak_collocation_penalty: -35
  # weak_collocation_penalty: -45
  rear_penalty: -12


moran:
  quick_code_indicator: "🗲"        # 简码标识符
  enable_word_filter: false         # 词辅功能
  word_filter_match_indicator: {}   # 词辅命中提示词 
  inject_fixed_chars: false          # 启用单字注入 是否输出简码表单字（如 jwrg 次选「佳」）
  inject_fixed_words: true          # 启用长词注入 是否输出简码表词语（如 lmsd 次选「两面三刀」）
  # 「出簡讓全」相關設置
  ijrq:
    enable: true                    # 出简让全开关
    show_hint: true                 # 显示简码提示
    enable_word: true               # 詞語級「讓全」，對二、三、四字詞有效
    enable_word_delay: 200          # 延遲觸發詞語級讓全效果,一般爲 200 *毫秒* 上下（僅 librime >= 1.14 可用）
    enable_word_defer: 2            # 延遲候選個數。必須是大於等於 1 的整數才有效果。
    suffix: "/"                     # 让全后缀
  # moran_hint_filter 的相关设置
  enable_aux_hint: false            # 辅助码提示（无用）
  enable_quick_code_hint: true      # 簡快碼提示（包括字和詞）
  quick_code_hint_indicator: ""     # 简快码提示符号（默認值 null 使用quick_code_indicator提示）
  quick_code_hint_skip_chars: true  # 取消單字的簡快碼提示
  # (仅*动词模式*) 输出优先级
  inject_prioritize: "word"         # char: 优先单字, word: 优先词组，其他值按码表顺序
  # 「PIN」相關設置
  pin:
    enable: true                    # 启用置顶功能
    indicator: "📌"                 # 置顶标识
    panacea:
      infix: "//"                   # 造词分隔符
      prompt: "〔加词〕"            # 造词提示
      freestyle: false              # 启用自由模式
  # 「通用」字符集設置 （不影響「增廣」：增廣仍顯示*所有*字符）
  charset: simp             # both: 允許繁體和簡體同時顯示 | simp: 只顯示簡化字 | trad: 只顯示繁體字
  #略码  moran_processor.lua → shorthands 修改
  shorthands: false   
  